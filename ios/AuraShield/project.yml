name: AuraShield
options:
  bundleIdPrefix: net.skygrid
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  AuraShield:
    type: application
    platform: iOS
    sources:
      - AuraShieldApp.swift
      - ContentView.swift
      - AuraPresenceModel.swift
      - AuraShieldNumberStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.skygrid.AuraShield
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aura
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - AuraShieldUITests
  AuraShieldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: AuraShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.skygrid.AuraShieldUITests
        GENERATE_INFOPLIST_FILE: YES
