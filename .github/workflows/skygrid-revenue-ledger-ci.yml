name: SKYGRID Revenue Ledger CI

on:
  pull_request:
    paths:
      - "lib/skygrid-revenue-ledger.mjs"
      - "api/skygrid/revenue.mjs"
      - "tests/skygrid-revenue-ledger.test.mjs"
      - "schemas/skygrid-infrastructure-revenue.schema.json"
      - "lib/accounting/verified-revenue-ledger.mjs"
      - "scripts/skygrid-revenue-ledger.mjs"
      - "tests/verified-revenue-ledger.test.mjs"
      - "configs/accounting/verified-revenue-ledger.sample.json"
      - "docs/accounting/verified-infrastructure-revenue-ledger.md"
      - "package.json"
      - ".github/workflows/skygrid-revenue-ledger-ci.yml"
  push:
    branches:
      - MVPuknowme
    paths:
      - "lib/skygrid-revenue-ledger.mjs"
      - "api/skygrid/revenue.mjs"
      - "tests/skygrid-revenue-ledger.test.mjs"
      - "schemas/skygrid-infrastructure-revenue.schema.json"
      - "lib/accounting/verified-revenue-ledger.mjs"
      - "scripts/skygrid-revenue-ledger.mjs"
      - "tests/verified-revenue-ledger.test.mjs"
      - "configs/accounting/verified-revenue-ledger.sample.json"
      - "docs/accounting/verified-infrastructure-revenue-ledger.md"
      - "package.json"
      - ".github/workflows/skygrid-revenue-ledger-ci.yml"

permissions:
  contents: read

jobs:
  revenue-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check lib/accounting/verified-revenue-ledger.mjs
          node --check scripts/skygrid-revenue-ledger.mjs
          node --check tests/verified-revenue-ledger.test.mjs

      - name: Revenue ledger tests
        run: npm run revenue:ledger:test

      - name: Revenue ledger verifier
        run: npm run revenue:ledger:verify

  revenue-ledger-powershell:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: PowerShell ledger validation
        shell: pwsh
        run: |
          npm run revenue:ledger:test
          npm run revenue:ledger:verify
          node scripts/skygrid-revenue-ledger.mjs .\configs\accounting\verified-revenue-ledger.sample.json
