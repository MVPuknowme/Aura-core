name: Aura Recon Companion

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'apps/aura-recon-companion/**'
      - 'apps/speak/**'
      - 'tests/speak-review-lock.test.mjs'
      - 'package.json'
      - '.github/workflows/aura-recon-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aura-recon-companion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/aura-recon-companion/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q

  devcontainer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/aura-recon-companion/devcontainer.json
          push: never
          runCmd: |
            python -m pip check
            cd backend && python -m pytest -q

  jaxons-aura-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Jaxon’s aura as vscode
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/jaxons-aura/devcontainer.json
          push: never
          runCmd: |
            set -eu
            test "$(id -un)" = vscode
            node -e 'const config = JSON.parse(require("node:fs").readFileSync(".devcontainer/jaxons-aura/devcontainer.json", "utf8")); require("node:assert/strict").equal(process.versions.node.split(".")[0], config.features["ghcr.io/devcontainers/features/node:2"].version)'
            test "$SKYGRID_EVIDENCE_DIR" = /home/vscode/.skygrid-private
            test "$(stat -c %u "$SKYGRID_EVIDENCE_DIR")" = "$(id -u)"
            test "$(stat -c %g "$SKYGRID_EVIDENCE_DIR")" = "$(id -g)"
            test "$(stat -c %a "$SKYGRID_EVIDENCE_DIR")" = 700
            probe=$(mktemp "$SKYGRID_EVIDENCE_DIR/.ci-write-check.XXXXXX")
            rm "$probe"
            node --test tests/speak-review-lock.test.mjs
