name: Aura Recon Companion

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'apps/aura-recon-companion/**'
      - '.github/workflows/aura-recon-companion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aura-recon-companion/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/aura-recon-companion/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q

  devcontainer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/aura-recon-companion/devcontainer.json
          push: never
          runCmd: |
            python -m pip check
            cd backend && python -m pytest -q
