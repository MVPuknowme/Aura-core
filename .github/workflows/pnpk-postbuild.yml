name: PNPK Post-Build Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/pnpk-postbuild.yml"
      - "bridge/**/*.pnpk"
      - "scripts/run-pnpk-postbuild.mjs"
      - "scripts/validate-pnpk.mjs"
      - "scripts/verify-switch-preruns.mjs"
      - "scripts/solana-playground-preflight.mjs"
      - "scripts/aura-core-ai-ramp-switch.mjs"
      - "scripts/skygrid-partition-router.mjs"
      - "scripts/skygrid-autodrill-sim.mjs"
      - "api/runtime-core.mjs"
      - "api/runtime.mjs"
      - "tests/pnpk-postbuild.test.mjs"
      - "tests/skygrid-capacity-lease.test.mjs"
      - "lib/pnpk-production-relight-preflight.mjs"
      - "tests/pnpk-production-relight-preflight.test.mjs"
      - "tests/pnpk-production-hardening.test.mjs tests/pnpk-production-relight-executor.test.mjs tests/skygrid-live-validation.test.mjs tests/pnpk-production-runtime.test.mjs"
      - "examples/autodrill-healthcheck.pnpk"
      - "lib/pnpk-production-relight-executor.mjs"
      - "tests/pnpk-production-relight-executor.test.mjs"
      - "lib/skygrid-live-validation.mjs"
      - "scripts/skygrid-live-validation.mjs"
      - "tests/skygrid-live-validation.test.mjs"
      - "tests/pnpk-production-runtime.test.mjs"
      - "package.json"
  push:
    branches:
      - MVPuknowme
    paths:
      - ".github/workflows/pnpk-postbuild.yml"
      - "bridge/**/*.pnpk"
      - "scripts/run-pnpk-postbuild.mjs"
      - "scripts/validate-pnpk.mjs"
      - "scripts/verify-switch-preruns.mjs"
      - "scripts/solana-playground-preflight.mjs"
      - "scripts/aura-core-ai-ramp-switch.mjs"
      - "scripts/skygrid-partition-router.mjs"
      - "scripts/skygrid-autodrill-sim.mjs"
      - "api/runtime-core.mjs"
      - "api/runtime.mjs"
      - "tests/pnpk-postbuild.test.mjs"
      - "tests/skygrid-capacity-lease.test.mjs"
      - "lib/pnpk-production-relight-preflight.mjs"
      - "tests/pnpk-production-relight-preflight.test.mjs"
      - "tests/pnpk-production-hardening.test.mjs"
      - "examples/autodrill-healthcheck.pnpk"
      - "lib/pnpk-production-relight-executor.mjs"
      - "tests/pnpk-production-relight-executor.test.mjs"
      - "lib/skygrid-live-validation.mjs"
      - "scripts/skygrid-live-validation.mjs"
      - "tests/skygrid-live-validation.test.mjs"
      - "tests/pnpk-production-runtime.test.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} allowlisted post-build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read PNPK alpha runtime
        id: runtime
        shell: pwsh
        run: |
          $runtime = (Get-Content -Raw bridge/skygrid-emergency-onramp.pnpk | ConvertFrom-Json).runtime
          if ($runtime.engine -cne 'node' -or $runtime.channel -cne 'alpha' -or $runtime.scope -cne 'pnpk_postbuild_validation') {
            throw 'PNPK requires a Node.js alpha runtime scoped to post-build validation'
          }
          if ($runtime.version -cnotmatch '^\d+\.\d+\.\d+-alpha\.\d+(\.\d+)*$') {
            throw 'PNPK alpha runtime must pin an exact prerelease version'
          }
          "node-version=$($runtime.version)" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js Alpha for partition via Auto-Drill
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.runtime.outputs.node-version }}

      - name: Verify pinned alpha runtime
        run: node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const runtime = JSON.parse(fs.readFileSync("bridge/skygrid-emergency-onramp.pnpk", "utf8")).runtime; assert.equal(process.versions.node, runtime.version); console.log(process.version);'

      - name: Unit-test PNPK adapter
        run: node --test tests/pnpk-postbuild.test.mjs tests/skygrid-intake-policy-core.test.mjs tests/pnpk-production-relight-preflight.test.mjs tests/pnpk-production-hardening.test.mjs

      - name: Run PNPK post-build preflight
        run: node scripts/run-pnpk-postbuild.mjs

      - name: Upload hash-bound receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pnpk-postbuild-${{ matrix.os }}
          path: artifacts/pnpk/proofs/postbuild-latest.json
          if-no-files-found: error
