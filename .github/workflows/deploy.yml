name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  pre-flight:
    name: Pre-Flight Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.checks.outputs.should_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate artifacts
        id: checks
        run: |
          echo "Running pre-flight checks..."
          
          # Check if Newman artifact exists
          if [ -f "artifacts/newman/latest-summary.json" ]; then
            echo "✓ Newman artifact found"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Newman artifact missing - deployment blocked"
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Check for critical files
          if [ ! -f "package.json" ]; then
            echo "✗ package.json not found"
            exit 1
          fi
          echo "✓ package.json found"
          echo "Pre-flight checks passed"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: pre-flight
    if: github.ref == 'refs/heads/main' && needs.pre-flight.outputs.should_deploy == 'true'
    environment:
      name: staging
      url: https://staging.your-domain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: staging

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment command here
          # Example: npm run deploy:staging
          echo "Deployment simulation: npm run deploy:staging"

      - name: Run smoke tests on staging
        run: |
          echo "Running smoke tests on staging..."
          # Add your smoke test command
          # Example: npm run test:smoke
          echo "Smoke tests passed"

      - name: Post deployment notification
        if: success()
        run: |
          echo "✓ Successfully deployed to staging"
          echo "Environment: https://staging.your-domain.com"
          echo "Deployment ID: ${{ github.run_id }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-flight
    if: startsWith(github.ref, 'refs/tags/v') && needs.pre-flight.outputs.should_deploy == 'true'
    environment:
      name: production
      url: https://your-domain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your deployment command here
          # Example: npm run deploy:production
          echo "Deployment simulation: npm run deploy:production"

      - name: Run smoke tests on production
        run: |
          echo "Running smoke tests on production..."
          # Add your smoke test command
          # Example: npm run test:smoke
          echo "Smoke tests passed"

      - name: Post deployment notification
        if: success()
        run: |
          echo "✓ Successfully deployed to production"
          echo "Environment: https://your-domain.com"
          echo "Release: ${{ github.ref_name }}"
          echo "Deployment ID: ${{ github.run_id }}"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed - initiating rollback..."
          # Add your rollback command here
          # Example: npm run rollback:production
          echo "Rollback simulation: npm run rollback:production"
