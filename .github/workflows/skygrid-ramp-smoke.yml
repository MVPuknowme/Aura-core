name: SKYGRID Ramp Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - MVPuknowme
      - main
    paths:
      - "api/runtime.mjs"
      - "api/runtime-core.mjs"
      - "vercel.json"
      - "postman/**"
      - "config/skygrid-route-manifest.json"
      - "scripts/check-skygrid-public-routes.mjs"
      - "scripts/verify-skygrid-manifest-sync.mjs"
      - "scripts/skygrid-local-runtime-router.mjs"
      - "scripts/skygrid-local-runtime-server.mjs"
      - "scripts/skygrid-ramp-smoke.sh"
      - ".github/workflows/skygrid-ramp-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SKYGRID_BASE_URL: http://127.0.0.1:3000
      SKYGRID_LOCAL_PUBLIC_URL: http://127.0.0.1:3000
      SKYGRID_CHECK_REMOTE_PUBLIC: "false"
      SKYGRID_CHECK_VERCEL: "false"
      SKYGRID_CHECK_LEGACY_ALIAS: "false"
      SKYGRID_ROUTE_CHECK_TIMEOUT_MS: 15000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate runtime syntax
        run: node --check api/runtime.mjs

      - name: Validate Postman JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('postman/skygrid-autodrill.collection.json','utf8')); console.log('collection ok')"
          node -e "JSON.parse(require('fs').readFileSync('postman/skygrid-autodrill.environment.template.json','utf8')); console.log('environment ok')"

      - name: Verify GitHub route manifest sync
        run: node scripts/verify-skygrid-manifest-sync.mjs

      - name: Create signed AutoDrill smoke proof
        run: |
          node <<'NODE'
          const { createHmac, randomBytes } = require('node:crypto');
          const { writeFileSync } = require('node:fs');

          const secret = randomBytes(32).toString('hex');
          const proof = {
            run_id: `github-smoke-${process.env.GITHUB_RUN_ID}`,
            generated_at: new Date().toISOString(),
            ok: true,
            checks: [
              { name: 'local_runtime_smoke', ok: true }
            ]
          };

          const signingInput = `${proof.run_id}.${proof.generated_at}.${proof.ok}.${JSON.stringify(proof.checks)}`;
          proof.signature = createHmac('sha256', secret).update(signingInput).digest('hex');

          writeFileSync('/tmp/skygrid-proof-secret', secret, { mode: 0o600 });
          writeFileSync('/tmp/skygrid-autodrill-proof.json', JSON.stringify(proof), { mode: 0o600 });
          NODE

      - name: Start local SKYGRID runtime
        run: |
          export SKYGRID_PROOF_SECRET="$(cat /tmp/skygrid-proof-secret)"
          export SKYGRID_AUTODRILL_PROOF_JSON="$(cat /tmp/skygrid-autodrill-proof.json)"
          PORT=3000 node scripts/skygrid-local-runtime-server.mjs > /tmp/skygrid-local-runtime.log 2>&1 &
          echo $! > /tmp/skygrid-local-runtime.pid
          for i in {1..20}; do
            if curl -fsS "$SKYGRID_BASE_URL/health.json" >/dev/null; then
              echo "SKYGRID local runtime is ready"
              exit 0
            fi
            sleep 1
          done
          echo "SKYGRID local runtime did not become ready"
          cat /tmp/skygrid-local-runtime.log || true
          exit 1

      - name: Run SKYGRID smoke test
        run: bash scripts/skygrid-ramp-smoke.sh "$SKYGRID_BASE_URL"

      - name: Run local public route checker
        run: node scripts/check-skygrid-public-routes.mjs

      - name: Stop local SKYGRID runtime
        if: always()
        run: |
          if [ -f /tmp/skygrid-local-runtime.pid ]; then
            kill "$(cat /tmp/skygrid-local-runtime.pid)" || true
          fi
          rm -f /tmp/skygrid-proof-secret /tmp/skygrid-autodrill-proof.json
          cat /tmp/skygrid-local-runtime.log || true
