name: Debug on Failure

on:
  workflow_run:
    workflows: ['SKYGRID Ramp Smoke Test']
    types: [completed]
    branches: [main]

jobs:
  debug:
    name: Capture Debug Artifacts
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create debug directory
        run: mkdir -p debug-bundle/{logs,artifacts}

      - name: Capture environment info
        run: |
          echo "=== Environment Variables ===" > debug-bundle/logs/env-vars.log
          env | grep -E '(GITHUB|SKYGRID|NODE|PYTHON)' >> debug-bundle/logs/env-vars.log || true
          echo "" >> debug-bundle/logs/env-vars.log
          echo "=== System Info ===" >> debug-bundle/logs/env-vars.log
          uname -a >> debug-bundle/logs/env-vars.log
          echo "" >> debug-bundle/logs/env-vars.log
          echo "=== Disk Space ===" >> debug-bundle/logs/env-vars.log
          df -h >> debug-bundle/logs/env-vars.log

      - name: Check for artifacts
        run: |
          echo "=== Artifact Search Results ===" > debug-bundle/logs/artifact-check.log
          find . -name 'latest-summary.json' -type f 2>/dev/null | tee -a debug-bundle/logs/artifact-check.log || echo "No Newman summary found" >> debug-bundle/logs/artifact-check.log
          find artifacts -type f 2>/dev/null | tee -a debug-bundle/logs/artifact-check.log || echo "No artifacts directory" >> debug-bundle/logs/artifact-check.log
          ls -la artifacts/newman/ 2>/dev/null >> debug-bundle/logs/artifact-check.log || echo "Newman directory not found" >> debug-bundle/logs/artifact-check.log

      - name: Capture workflow logs
        run: |
          echo "=== Smoke Test Logs ===" > debug-bundle/logs/smoke-test.log
          echo "Check Actions tab for full logs" >> debug-bundle/logs/smoke-test.log

      - name: Create debug summary
        run: |
          cat > debug-bundle/summary.md << 'EOF'
          # Debug Summary
          
          **Failure Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)
          **Workflow:** SKYGRID Ramp Smoke Test
          **Branch:** main
          **Commit:** ${{ github.sha }}
          
          ## Issue
          Missing or invalid Newman artifact at `artifacts/newman/latest-summary.json`
          
          ## Root Cause Analysis
          1. API test suite did not complete successfully
          2. Newman summary was not generated
          3. Smoke test requires this file to verify API readiness
          
          ## Remediation Steps
          1. Review test output in Actions logs
          2. Check API connectivity and responses
          3. Verify Newman installation and configuration
          4. Re-run smoke test after fixing root cause
          
          ## Debug Artifacts
          - `logs/env-vars.log` - Environment configuration
          - `logs/artifact-check.log` - Artifact discovery results
          - `logs/smoke-test.log` - Smoke test execution details
          
          ---
          Generated by Debug Workflow
          EOF
          cat debug-bundle/summary.md

      - name: Upload debug bundle
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: debug-bundle-${{ github.run_id }}
          path: debug-bundle/
          retention-days: 30

      - name: Comment on workflow run
        if: always()
        run: |
          echo "Debug artifacts uploaded: debug-bundle-${{ github.run_id }}"
          echo "View in Actions tab under artifacts"
