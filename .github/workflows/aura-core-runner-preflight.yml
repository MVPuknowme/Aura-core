name: Aura-Core Runner Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/aura-core-runner-preflight.yml"
      - "scripts/setup-msys2-path.ps1"
      - "scripts/verify-skygrid-routes.mjs"
      - "scripts/test-skygrid-routing-success.mjs"
      - "requirements-mcp.txt"
      - "package.json"
  push:
    branches:
      - MVPuknowme
    paths:
      - ".github/workflows/aura-core-runner-preflight.yml"
      - "scripts/setup-msys2-path.ps1"
      - "scripts/verify-skygrid-routes.mjs"
      - "scripts/test-skygrid-routing-success.mjs"
      - "requirements-mcp.txt"
      - "package.json"

jobs:
  windows-msys2-preflight:
    name: Windows MSYS2 PATH + MCP + SKYGRID route verifier
    runs-on: windows-latest

    env:
      SKYGRID_BASE_URL: https://skygrid-protocol.net
      SKYGRID_ALLOW_PENDING_DOMAIN: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add pre-installed MSYS2 to PATH
        shell: pwsh
        run: .\scripts\setup-msys2-path.ps1

      - name: Verify MSYS2 tools
        shell: pwsh
        run: |
          Write-Host "PATH=$env:PATH"
          Get-Command bash -ErrorAction Stop
          bash --version
          Get-Command pacman -ErrorAction Stop
          pacman --version

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm --version

      - name: Install Node dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile=false

      - name: Install Python MCP dependency
        shell: pwsh
        run: python -m pip install -r requirements-mcp.txt

      - name: Verify MCP SDKs
        shell: pwsh
        run: |
          pnpm run mcp:check
          python -c "import mcp; print('Python MCP available')"

      - name: Verify SKYGRID production routes
        shell: pwsh
        run: pnpm run skygrid:verify

      - name: Test SKYGRID routing success classification
        shell: pwsh
        run: pnpm run skygrid:test:routing
