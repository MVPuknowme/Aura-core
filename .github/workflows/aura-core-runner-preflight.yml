name: Aura-Core Runner Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/aura-core-runner-preflight.yml"
      - "scripts/setup-msys2-path.ps1"
      - "scripts/verify-skygrid-routes.mjs"
      - "scripts/test-skygrid-routing-success.mjs"
      - "scripts/skygrid-operator-*.mjs"
      - "tests/skygrid-operator-*.test.mjs"
      - "config/skygrid-operator.mjs"
      - "Dockerfile.operator"
      - ".dockerignore"
      - "requirements-mcp.txt"
      - "package.json"
  push:
    branches:
      - MVPuknowme
    paths:
      - ".github/workflows/aura-core-runner-preflight.yml"
      - "scripts/setup-msys2-path.ps1"
      - "scripts/verify-skygrid-routes.mjs"
      - "scripts/test-skygrid-routing-success.mjs"
      - "scripts/skygrid-operator-*.mjs"
      - "tests/skygrid-operator-*.test.mjs"
      - "config/skygrid-operator.mjs"
      - "Dockerfile.operator"
      - ".dockerignore"
      - "requirements-mcp.txt"
      - "package.json"

jobs:
  windows-msys2-preflight:
    name: Windows MSYS2 PATH + MCP + SKYGRID route verifier
    runs-on: windows-latest

    env:
      SKYGRID_BASE_URL: https://aura-core-home-e539c0b1.vercel.app
      SKYGRID_ALLOW_PENDING_DOMAIN: "true"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add pre-installed MSYS2 to PATH
        shell: pwsh
        run: .\scripts\setup-msys2-path.ps1

      - name: Verify MSYS2 tools
        shell: pwsh
        run: |
          Write-Host "PATH=$env:PATH"
          Get-Command bash -ErrorAction Stop
          bash --version
          Get-Command pacman -ErrorAction Stop
          pacman --version

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate
          pnpm --version

      - name: Install Node dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile=false

      - name: Install Python MCP dependency
        shell: pwsh
        run: python -m pip install -r requirements-mcp.txt

      - name: Verify MCP SDKs
        shell: pwsh
        run: |
          pnpm run mcp:check
          python -c "import mcp; print('Python MCP available')"

      - name: Verify SKYGRID production routes
        shell: pwsh
        run: pnpm run skygrid:verify

      - name: Test SKYGRID routing success classification
        shell: pwsh
        run: pnpm run skygrid:test:routing

  operator-container-preflight:
    name: Operator container fail-closed smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run operator preflight
        run: node scripts/skygrid-operator-preflight.mjs

      - name: Build allowlisted operator image
        run: docker build -f Dockerfile.operator -t aura-core-operator:ci .

      - name: Probe container runtime and fail-closed auth
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name aura-core-operator-ci \
            --env CI=true \
            --publish 127.0.0.1:3000:3000 \
            aura-core-operator:ci

          cleanup() {
            docker logs aura-core-operator-ci || true
            docker rm --force aura-core-operator-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/tmp/skygrid-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Operator container did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done

          node -e 'const value=JSON.parse(require("fs").readFileSync("/tmp/skygrid-health.json","utf8")); if (!value.ok || value.readiness?.authentication_ready !== false) process.exit(1)'

          auth_status=$(curl --silent --output /tmp/skygrid-auth.json --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"source":"container-ci","type":"health"}' \
            http://127.0.0.1:3000/api/agent/signals)
          test "$auth_status" = "503"
          node -e 'const value=JSON.parse(require("fs").readFileSync("/tmp/skygrid-auth.json","utf8")); if (value.error !== "ingest_auth_not_configured") process.exit(1)'
