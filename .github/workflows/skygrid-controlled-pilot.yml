name: SKYGRID Controlled Pilot Verification

on:
  push:
    branches: [ "MVPuknowme" ]
  pull_request:
    branches: [ "MVPuknowme" ]
  workflow_dispatch: {}

jobs:
  verify:
    name: Controlled Pilot checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@10.23.0

      - name: Verify toolchain
        shell: bash
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies (pnpm --frozen-lockfile)
        run: pnpm install --frozen-lockfile

      - name: PNPK validation
        run: pnpm run pnpk:validate

      - name: Manifest sync
        run: pnpm run manifest:sync

      - name: Partition verification
        run: pnpm run partition:verify

      - name: Autodrill simulation
        run: pnpm run autodrill:sim

      - name: Emergency gate
        run: pnpm run emergency:gate

      - name: Security IOC check
        run: pnpm run security:ioc-check

      - name: Intake policy test
        run: pnpm run intake:policy-test

      - name: Start SKYGRID local runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          nohup pnpm run local:runtime > runtime.log 2>&1 &
          echo $! > /tmp/skygrid_pid

      - name: Start SKYGRID local runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $script = Join-Path $PWD.Path "scripts\skygrid-local-runtime-server.mjs"

          $p = Start-Process `
            -FilePath $node `
            -ArgumentList $script `
            -WorkingDirectory $PWD.Path `
            -RedirectStandardOutput "runtime.log" `
            -RedirectStandardError "runtime-error.log" `
            -PassThru

          $p.Id | Out-File `
            -FilePath "$env:RUNNER_TEMP\skygrid_pid" `
            -Encoding ascii

          Write-Host "Started SKYGRID runtime PID $($p.Id)"

      - name: Wait for SKYGRID health (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "Waiting for http://127.0.0.1:3000/api/health to return 200..."
          for i in {1..60}; do
            if curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health | grep -q '^200$'; then
              echo "runtime healthy"
              exit 0
            fi
            sleep 2
          done
          echo "runtime did not become healthy in time"
          cat runtime.log || true
          exit 1

      - name: Wait for SKYGRID health (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Waiting for SKYGRID runtime health..."
          $ok = $false

          for ($i = 0; $i -lt 60; $i++) {
            $status = & curl.exe `
              --noproxy "*" `
              --silent `
              --show-error `
              --output NUL `
              --write-out "%{http_code}" `
              "http://127.0.0.1:3000/api/health"

            if ($status -eq "200") {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ok) {
            Write-Host "Runtime did not become healthy."

            if (Test-Path runtime.log) {
              Write-Host "--- runtime.log ---"
              Get-Content runtime.log -Tail 200
            }

            if (Test-Path runtime-error.log) {
              Write-Host "--- runtime-error.log ---"
              Get-Content runtime-error.log -Tail 200
            }

            $pidPath = "$env:RUNNER_TEMP\skygrid_pid"
            if (Test-Path $pidPath) {
              $runtimePid = Get-Content $pidPath
              Get-Process -Id $runtimePid -ErrorAction SilentlyContinue
            }

            exit 1
          }

          Write-Host "SKYGRID runtime healthy"

      - name: Training drill - accepted paths
        run: >-
          pnpm run training:drill --
          --base-url=http://127.0.0.1:3000
          --scenario-file=training/scenarios/skygrid-auto-drill-v1.json
          --out-dir=training/receipts/ci-${{ runner.os }}
          --run-id=accepted-paths

      - name: Training drill - fail-closed paths
        run: >-
          pnpm run training:fail-closed --
          --base-url=http://127.0.0.1:3000
          --scenario-file=training/scenarios/skygrid-fail-closed-v1.json
          --out-dir=training/receipts/ci-${{ runner.os }}
          --run-id=fail-closed

      - name: Verify training receipts and drill results
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const dir = path.join(
            process.cwd(),
            'training',
            'receipts',
            'ci-${{ runner.os }}'
          );

          const expected = new Map([
            ['accepted-paths.json', 5],
            ['fail-closed.json', 11],
          ]);

          if (!fs.existsSync(dir)) {
            console.error('CI receipt directory not found:', dir);
            process.exit(1);
          }

          const files = fs.readdirSync(dir)
            .filter((file) => file.endsWith('.json'))
            .sort();

          if (files.length !== expected.size) {
            console.error('Expected two current-run receipts, found:', files);
            process.exit(1);
          }

          let totalScenarios = 0;
          let totalPassed = 0;

          for (const [file, expectedScenarios] of expected) {
            if (!files.includes(file)) {
              console.error('Missing expected training receipt:', file);
              process.exit(1);
            }

            const receipt = JSON.parse(
              fs.readFileSync(path.join(dir, file), 'utf8')
            );

            if (receipt.ok !== true) {
              console.error(file, 'reports ok !== true');
              process.exit(1);
            }

            if (
              receipt.summary?.scenarios !== expectedScenarios ||
              receipt.summary?.passed !== expectedScenarios ||
              receipt.summary?.failed !== 0
            ) {
              console.error(file, 'has an unexpected summary:', receipt.summary);
              process.exit(1);
            }

            if (!Array.isArray(receipt.results) || receipt.results.some((result) => result.passed !== true)) {
              console.error(file, 'contains a failed scenario');
              process.exit(1);
            }

            if (file === 'fail-closed.json') {
              if (receipt.sentinel !== 'fail_closed' || receipt.allRequestsRejected !== true) {
                console.error('Fail-closed receipt did not prove rejection safety');
                process.exit(1);
              }
            }

            totalScenarios += receipt.summary.scenarios;
            totalPassed += receipt.summary.passed;
          }

          if (totalScenarios !== 16 || totalPassed !== 16) {
            console.error('Combined training result is not 16/16:', { totalScenarios, totalPassed });
            process.exit(1);
          }

          console.log('Training drills verified: 16/16 across accepted and fail-closed lanes');
          "

      - name: Create controlled-pilot summary
        if: always()
        run: |
          echo "PNPK validation" >> $GITHUB_STEP_SUMMARY
          echo "Partition verification" >> $GITHUB_STEP_SUMMARY
          echo "Autodrill result" >> $GITHUB_STEP_SUMMARY
          echo "Emergency-gate result" >> $GITHUB_STEP_SUMMARY
          echo "Intake-policy result" >> $GITHUB_STEP_SUMMARY
          echo "Accepted-path training: 5 scenarios" >> $GITHUB_STEP_SUMMARY
          echo "Fail-closed training: 11 scenarios" >> $GITHUB_STEP_SUMMARY
          echo "Combined training target: 16/16" >> $GITHUB_STEP_SUMMARY
          echo "Controlled-pilot status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload training receipts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-receipts-${{ runner.os }}
          path: training/receipts/ci-${{ runner.os }}/*.json
          if-no-files-found: warn

      - name: Stop SKYGRID runtime (Ubuntu)
        if: runner.os == 'Linux' && always()
        run: |
          if [ -f /tmp/skygrid_pid ]; then
            PID=$(cat /tmp/skygrid_pid)
            echo "Killing $PID"
            kill $PID || true
          fi

      - name: Stop SKYGRID runtime (Windows)
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          $pfile = "$env:RUNNER_TEMP\skygrid_pid"
          if (Test-Path $pfile) {
            $runtimePid = [int](Get-Content $pfile)
            Write-Host "Stopping process $runtimePid"
            Stop-Process -Id $runtimePid -ErrorAction SilentlyContinue
          }
