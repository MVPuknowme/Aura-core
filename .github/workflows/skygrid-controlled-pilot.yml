name: SKYGRID Controlled Pilot Verification

on:
  push:
    branches:
      - MVPuknowme
  pull_request:
    branches:
      - MVPuknowme
  workflow_dispatch: {}

jobs:
  verify:
    name: Controlled Pilot checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PNPK validation
        run: pnpm run pnpk:validate

      - name: Manifest sync
        run: pnpm run manifest:sync

      - name: Partition verification
        run: pnpm run partition:verify

      - name: Autodrill simulation
        run: pnpm run autodrill:sim

      - name: Emergency gate
        run: pnpm run emergency:gate

      - name: Security IOC check
        run: pnpm run security:ioc-check

      - name: Intake policy test
        run: pnpm run intake:policy-test

      - name: Start SKYGRID local runtime on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nohup node scripts/skygrid-local-runtime-server.mjs \
            > runtime.log 2>&1 &
          echo "$!" > /tmp/skygrid_pid
          echo "Started SKYGRID runtime PID $(cat /tmp/skygrid_pid)"

      - name: Start SKYGRID local runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "scripts\skygrid-local-runtime-server.mjs"

          $stdout = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid-runtime.log"

          $stderr = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid-runtime-error.log"

          $pidFile = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid_pid"

          Remove-Item `
            $stdout, $stderr, $pidFile `
            -Force `
            -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $node `
            -ArgumentList @($script) `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          $process.Id |
            Set-Content `
              -LiteralPath $pidFile `
              -Encoding ascii

          "SKYGRID_RUNTIME_STDOUT=$stdout" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "SKYGRID_RUNTIME_STDERR=$stderr" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "Started SKYGRID Node runtime PID $($process.Id)"

      - name: Wait for SKYGRID health on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Waiting for SKYGRID runtime health..."

          for attempt in {1..60}; do
            if curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              http://127.0.0.1:3000/api/health |
              grep --quiet '^200$'
            then
              echo "SKYGRID Ubuntu runtime healthy"
              exit 0
            fi

            sleep 2
          done

          echo "--- runtime.log ---"
          cat runtime.log || true
          exit 1

      - name: Wait for SKYGRID health on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pidFile = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid_pid"

          if (-not (Test-Path -LiteralPath $pidFile)) {
            throw "SKYGRID runtime PID file was not created."
          }

          $runtimePid = [int](
            Get-Content -LiteralPath $pidFile
          )

          $healthy = $false

          Write-Host `
            "Waiting for http://127.0.0.1:3000/api/health..."

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $runtime = Get-Process `
              -Id $runtimePid `
              -ErrorAction SilentlyContinue

            if (-not $runtime) {
              Write-Host `
                "Runtime process $runtimePid exited before becoming healthy."
              break
            }

            try {
              $response = Invoke-WebRequest `
                -UseBasicParsing `
                -Uri "http://127.0.0.1:3000/api/health" `
                -TimeoutSec 2 `
                -ErrorAction Stop

              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host `
                "Health attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 2
          }

          if (-not $healthy) {
            Write-Host "`n--- runtime stdout ---"

            if (
              $env:SKYGRID_RUNTIME_STDOUT -and
              (Test-Path -LiteralPath $env:SKYGRID_RUNTIME_STDOUT)
            ) {
              Get-Content `
                -LiteralPath $env:SKYGRID_RUNTIME_STDOUT `
                -Tail 200
            }
            else {
              Write-Host "No runtime stdout file found."
            }

            Write-Host "`n--- runtime stderr ---"

            if (
              $env:SKYGRID_RUNTIME_STDERR -and
              (Test-Path -LiteralPath $env:SKYGRID_RUNTIME_STDERR)
            ) {
              Get-Content `
                -LiteralPath $env:SKYGRID_RUNTIME_STDERR `
                -Tail 200
            }
            else {
              Write-Host "No runtime stderr file found."
            }

            throw "SKYGRID Windows runtime health check failed."
          }

          Write-Host "SKYGRID Windows runtime healthy."

      - name: Accepted-path training drill
        run: pnpm run training:drill -- --base-url=http://127.0.0.1:3000 --scenario-file=training/scenarios/skygrid-auto-drill-v1.json --out-dir=training/receipts/ci-${{ runner.os }} --run-id=accepted-paths

      - name: Fail-closed training drill
        run: pnpm run training:fail-closed -- --base-url=http://127.0.0.1:3000 --scenario-file=training/scenarios/skygrid-fail-closed-v1.json --out-dir=training/receipts/ci-${{ runner.os }} --run-id=fail-closed

      - name: Verify training receipts
        run: pnpm run training:verify-receipts -- --dir=training/receipts/ci-${{ runner.os }}

      - name: Create controlled-pilot summary
        if: always()
        shell: bash
        run: |
          {
            echo "PNPK validation"
            echo "Partition verification"
            echo "Autodrill result"
            echo "Emergency-gate result"
            echo "Intake-policy result"
            echo "Accepted-path training: 5 scenarios"
            echo "Fail-closed training: 11 scenarios"
            echo "Combined training target: 16/16"
            echo "Controlled-pilot status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload training receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-receipts-${{ runner.os }}
          path: training/receipts/ci-${{ runner.os }}/*.json
          if-no-files-found: warn

      - name: Stop SKYGRID runtime on Ubuntu
        if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          if [ -f /tmp/skygrid_pid ]; then
            runtime_pid="$(cat /tmp/skygrid_pid)"
            echo "Stopping process $runtime_pid"
            kill "$runtime_pid" || true
          fi

      - name: Stop SKYGRID runtime on Windows
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          $pidFile = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid_pid"

          if (Test-Path -LiteralPath $pidFile) {
            $runtimePid = [int](
              Get-Content -LiteralPath $pidFile
            )

            Write-Host "Stopping process $runtimePid"

            Stop-Process `
              -Id $runtimePid `
              -Force `
              -ErrorAction SilentlyContinue
          }
