name: SKYGRID Controlled Pilot Verification

on:
  push:
    branches:
      - MVPuknowme
  pull_request:
    branches:
      - MVPuknowme
  workflow_dispatch: {}

jobs:
  verify:
    name: Controlled Pilot checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PNPK validation
        run: pnpm run pnpk:validate

      - name: Manifest sync
        run: pnpm run manifest:sync

      - name: Partition verification
        run: pnpm run partition:verify

      - name: Autodrill simulation
        run: pnpm run autodrill:sim

      - name: Emergency gate
        run: pnpm run emergency:gate

      - name: Security IOC check
        run: pnpm run security:ioc-check

      - name: Intake policy test
        run: pnpm run intake:policy-test

      - name: Start SKYGRID local runtime on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          nohup node scripts/skygrid-local-runtime-server.mjs \
            > runtime.log 2>&1 &
          echo "$!" > /tmp/skygrid_pid
          echo "Started SKYGRID runtime PID $(cat /tmp/skygrid_pid)"

      - name: Wait for SKYGRID health on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Waiting for SKYGRID runtime health..."

          for attempt in {1..60}; do
            if curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              http://127.0.0.1:3000/api/health |
              grep --quiet '^200$'
            then
              echo "SKYGRID Ubuntu runtime healthy"
              exit 0
            fi

            sleep 2
          done

          echo "--- runtime.log ---"
          cat runtime.log || true
          exit 1

      - name: Run Windows runtime and training drills
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $pnpm = (Get-Command pnpm.cmd -ErrorAction Stop).Source

          $script = Join-Path `
            $env:GITHUB_WORKSPACE `
            "scripts\skygrid-local-runtime-server.mjs"

          $stdout = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid-runtime.log"

          $stderr = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid-runtime-error.log"

          $receiptDir = "training/receipts/ci-${{ runner.os }}"

          Remove-Item `
            $stdout, $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          $runtime = Start-Process `
            -FilePath $node `
            -ArgumentList @($script) `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru

          try {
            Write-Host "Started SKYGRID runtime PID $($runtime.Id)"
            Write-Host "Waiting for SKYGRID Windows runtime health..."

            $healthy = $false

            for ($attempt = 1; $attempt -le 60; $attempt++) {
              if ($runtime.HasExited) {
                Write-Host "Runtime exited with code $($runtime.ExitCode)."
                break
              }

              $status = & curl.exe `
                --noproxy "*" `
                --silent `
                --show-error `
                --output NUL `
                --write-out "%{http_code}" `
                "http://127.0.0.1:3000/api/health"

              if (
                $LASTEXITCODE -eq 0 -and
                $status -eq "200"
              ) {
                $healthy = $true
                break
              }

              Write-Host "Health attempt $attempt returned: $status"
              Start-Sleep -Seconds 2
            }

            if (-not $healthy) {
              Write-Host "`n--- runtime stdout ---"

              if (Test-Path -LiteralPath $stdout) {
                Get-Content -LiteralPath $stdout -Tail 200
              }

              Write-Host "`n--- runtime stderr ---"

              if (Test-Path -LiteralPath $stderr) {
                Get-Content -LiteralPath $stderr -Tail 200
              }

              throw "SKYGRID Windows runtime did not become healthy."
            }

            Write-Host "SKYGRID Windows runtime healthy."

            & $pnpm run training:drill -- `
              "--base-url=http://127.0.0.1:3000" `
              "--scenario-file=training/scenarios/skygrid-auto-drill-v1.json" `
              "--out-dir=$receiptDir" `
              "--run-id=accepted-paths"

            if ($LASTEXITCODE -ne 0) {
              throw "Accepted-path training drill failed."
            }

            & $pnpm run training:fail-closed -- `
              "--base-url=http://127.0.0.1:3000" `
              "--scenario-file=training/scenarios/skygrid-fail-closed-v1.json" `
              "--out-dir=$receiptDir" `
              "--run-id=fail-closed"

            if ($LASTEXITCODE -ne 0) {
              throw "Fail-closed training drill failed."
            }

            & $pnpm run training:verify-receipts -- `
              "--dir=$receiptDir"

            if ($LASTEXITCODE -ne 0) {
              throw "Windows training receipt verification failed."
            }

            Write-Host "SKYGRID Windows controlled pilot verified: 16/16."
          }
          finally {
            if (
              $runtime -and
              -not $runtime.HasExited
            ) {
              Write-Host "Stopping SKYGRID runtime PID $($runtime.Id)"

              Stop-Process `
                -Id $runtime.Id `
                -Force `
                -ErrorAction SilentlyContinue
            }

            Write-Host "`n--- final runtime stdout ---"

            if (Test-Path -LiteralPath $stdout) {
              Get-Content -LiteralPath $stdout -Tail 200
            }

            Write-Host "`n--- final runtime stderr ---"

            if (Test-Path -LiteralPath $stderr) {
              Get-Content -LiteralPath $stderr -Tail 200
            }
          }

      - name: Accepted-path training drill
        if: runner.os == 'Linux'
        run: pnpm run training:drill -- --base-url=http://127.0.0.1:3000 --scenario-file=training/scenarios/skygrid-auto-drill-v1.json --out-dir=training/receipts/ci-${{ runner.os }} --run-id=accepted-paths

      - name: Fail-closed training drill
        if: runner.os == 'Linux'
        run: pnpm run training:fail-closed -- --base-url=http://127.0.0.1:3000 --scenario-file=training/scenarios/skygrid-fail-closed-v1.json --out-dir=training/receipts/ci-${{ runner.os }} --run-id=fail-closed

      - name: Verify training receipts
        if: runner.os == 'Linux'
        run: pnpm run training:verify-receipts -- --dir=training/receipts/ci-${{ runner.os }}

      - name: Create controlled-pilot summary
        if: always()
        shell: bash
        run: |
          {
            echo "PNPK validation"
            echo "Partition verification"
            echo "Autodrill result"
            echo "Emergency-gate result"
            echo "Intake-policy result"
            echo "Accepted-path training: 5 scenarios"
            echo "Fail-closed training: 11 scenarios"
            echo "Combined training target: 16/16"
            echo "Controlled-pilot status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload training receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-receipts-${{ runner.os }}
          path: training/receipts/ci-${{ runner.os }}/*.json
          if-no-files-found: warn

      - name: Stop SKYGRID runtime on Ubuntu
        if: runner.os == 'Linux' && always()
        shell: bash
        run: |
          if [ -f /tmp/skygrid_pid ]; then
            runtime_pid="$(cat /tmp/skygrid_pid)"
            echo "Stopping process $runtime_pid"
            kill "$runtime_pid" || true
          fi

      - name: Stop SKYGRID runtime on Windows
        if: runner.os == 'Windows' && always()
        shell: pwsh
        run: |
          $pidFile = Join-Path `
            $env:RUNNER_TEMP `
            "skygrid_pid"

          if (Test-Path -LiteralPath $pidFile) {
            $runtimePid = [int](
              Get-Content -LiteralPath $pidFile
            )

            Write-Host "Stopping process $runtimePid"

            Stop-Process `
              -Id $runtimePid `
              -Force `
              -ErrorAction SilentlyContinue
          }
