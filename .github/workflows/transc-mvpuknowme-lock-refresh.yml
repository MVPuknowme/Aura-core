name: transc MVPuknowme lock refresh

on:
  push:
    branches:
      - feat/transc-mvpuknowme-allbridge

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/transc-mvpuknowme-allbridge

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify transc helper
        run: pnpm run transc:MVPuknowme:test

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build: refresh pnpm lock for Allbridge SDK"
          git push origin HEAD:feat/transc-mvpuknowme-allbridge
