name: Auto-Drill lease-use reconciliation
on:
  pull_request:
    paths:
      - 'lib/autodrill-*.mjs'
      - 'api/skygrid/autodrill-lease-use.mjs'
      - 'tests/autodrill-*.test.mjs'
      - 'lib/skygrid-revenue-ledger.mjs'
      - 'tests/skygrid-revenue-ledger.test.mjs'
      - '.github/workflows/autodrill-lease-use.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/autodrill-lease-use.test.mjs tests/autodrill-paid-use-plan.test.mjs tests/autodrill-lease-api.test.mjs tests/autodrill-regional-lease-fabric.test.mjs tests/skygrid-revenue-ledger.test.mjs
