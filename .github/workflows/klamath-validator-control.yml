name: Klamath Validator Control

on:
  pull_request:
    paths:
      - ".github/workflows/klamath-validator-control.yml"
      - "configs/klamath-validator-control.v1.json"
      - "bridge/skygrid-emergency-onramp.pnpk"
      - "lib/skygrid-live-validation.mjs"
      - "scripts/skygrid-live-validation.mjs"
      - "scripts/validate-pnpk.mjs"
      - "tests/skygrid-live-validation.test.mjs"
  push:
    branches: ["MVPuknowme"]
    paths:
      - ".github/workflows/klamath-validator-control.yml"
      - "configs/klamath-validator-control.v1.json"
      - "bridge/skygrid-emergency-onramp.pnpk"
      - "lib/skygrid-live-validation.mjs"
      - "scripts/skygrid-live-validation.mjs"
      - "scripts/validate-pnpk.mjs"
      - "tests/skygrid-live-validation.test.mjs"
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klamath-validator-control
  cancel-in-progress: false

env:
  CONTROL_TIMEZONE: America/Los_Angeles
  PNPK_PATH: bridge/skygrid-emergency-onramp.pnpk
  SKYGRID_LIVE_VALIDATION_BASE_URL: https://aura-core.vercel.app
  SKYGRID_LIVE_VALIDATION_ALLOWED_HOSTS: aura-core.vercel.app
  SKYGRID_LIVE_VALIDATION_TARGETS: /health.json,/dispatch,/api/highway/status

jobs:
  klamath-live-validation:
    name: Klamath live validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: PNPK pre-flight gate
        id: pnpk
        run: node scripts/validate-pnpk.mjs

      - name: Unit-test live validation
        if: steps.pnpk.outcome == 'success'
        run: node --test tests/skygrid-live-validation.test.mjs

      - name: Run live SKYGRID route validation
        id: live_validation
        if: steps.pnpk.outcome == 'success'
        run: node scripts/skygrid-live-validation.mjs

      - name: Upload live validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klamath-live-validation-receipt
          path: artifacts/pnpk/proofs/live-validation-latest.json
          if-no-files-found: error

      - name: Record proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Klamath Validator Control"
            echo "- Node: klamath-falls-core"
            echo "- Mode: production_validation_work"
            echo "- Live validation: true"
            echo "- Validation method: GET-only on allowlisted SKYGRID endpoints"
            echo "- Global production failover: false"
            echo "- Network relight: separate signed PNPK preflight + configured executor only"
            echo "- Schedule: hourly / 24x7 eligible"
            echo "- Control timezone: America/Los_Angeles"
            echo "- Event: ${{ github.event_name }}"
            echo "- PNPK gate: ${{ steps.pnpk.outcome }}"
            echo "- Live validation: ${{ steps.live_validation.outcome }}"
            echo "- PNPK semantics: fail_closed"
            echo "- Revenue/payout promotion: disabled"
            echo "- UTC timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_STEP_SUMMARY"
