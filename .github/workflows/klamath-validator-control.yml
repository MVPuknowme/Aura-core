name: Klamath Validator Control

on:
  push:
    branches: ["MVPuknowme"]
    paths:
      - ".github/workflows/klamath-validator-control.yml"
      - "configs/klamath-validator-control.v1.json"
      - "bridge/skygrid-emergency-onramp.pnpk"
      - "scripts/validate-pnpk.mjs"
      - "scripts/run-pnpk-postbuild.mjs"
      - "scripts/pnpk-access-transparency-policy.mjs"
      - "scripts/validate-power-mesh-fixture.mjs"
      - "fixtures/skygrid-power-mesh/**"
      - "schemas/skygrid-power-mesh-telemetry.schema.json"
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klamath-validator-control
  cancel-in-progress: false

env:
  CONTROL_TIMEZONE: America/Los_Angeles
  PNPK_PATH: bridge/skygrid-emergency-onramp.pnpk

jobs:
  klamath-safe-validation:
    name: Klamath safe validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Confirm 100 percent validator availability target
        id: availability
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Validator proof work eligible at this checkpoint; availability target is 100%."
          echo "Financial, signing, private-data, payout, and production-failover authorities remain blocked."

      - name: Checkout
        if: steps.availability.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.availability.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: PNPK pre-flight gate
        id: pnpk
        if: steps.availability.outputs.run == 'true'
        run: node scripts/validate-pnpk.mjs

      - name: Run Klamath telemetry validator
        if: steps.availability.outputs.run == 'true' && steps.pnpk.outcome == 'success'
        run: node scripts/validate-power-mesh-fixture.mjs

      - name: Record proof summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Klamath Validator Control"
            echo "- Node: klamath-falls-core"
            echo "- Mode: safe_validation_work"
            echo "- Live execution: false"
            echo "- Availability target: 100%"
            echo "- Schedule: hourly / 24x7 eligible"
            echo "- Control timezone: America/Los_Angeles"
            echo "- Event: ${{ github.event_name }}"
            echo "- Validator eligible: ${{ steps.availability.outputs.run }}"
            echo "- PNPK gate: ${{ steps.pnpk.outcome }}"
            echo "- PNPK path: bridge/skygrid-emergency-onramp.pnpk"
            echo "- PNPK semantics: fail_closed"
            echo "- Trust-interest guard: asset movement, wallet signing, transaction broadcast, payment execution, private-data movement, revenue promotion, and production failover blocked"
            echo "- UTC timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Revenue/payout promotion: disabled"
          } >> "$GITHUB_STEP_SUMMARY"
