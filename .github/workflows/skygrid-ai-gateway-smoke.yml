name: SKYGRID AI Gateway Smoke

on:
  push:
    branches:
      - MVPuknowme
  workflow_dispatch:

jobs:
  ai-gateway-smoke:
    runs-on: windows-latest

    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      AI_GATEWAY_MODEL: openai/gpt-4o-mini

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SKYGRID AI Gateway smoke
        run: node ./scripts/ai-gateway-smoke.mjs
