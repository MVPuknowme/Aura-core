name: Validate Cloudflare Edge Worker

on:
  pull_request:
    paths:
      - "cloudflare/skygrid-edge-worker/**"
      - ".github/workflows/cloudflare-edge-worker-ci.yml"
  push:
    branches:
      - MVPuknowme
    paths:
      - "cloudflare/skygrid-edge-worker/**"
      - ".github/workflows/cloudflare-edge-worker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and bundle mute-thunder-aa20
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: cloudflare/skygrid-edge-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: cloudflare/skygrid-edge-worker/.node-version
          cache: npm
          cache-dependency-path: cloudflare/skygrid-edge-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and bundle Worker
        run: npm run build
